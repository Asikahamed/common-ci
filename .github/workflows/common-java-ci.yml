name: Java CI

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '17'
    secrets:
      dockerhub-username:
        required: true
      dockerhub-token:
        required: true

jobs:
  # ==========================================
  # JOB 1: Build Java App & Execute Unit Tests
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java-version }}
          cache: 'maven'

      - name: Build & Test with Maven
        run: ./mvnw clean package

      - name: Upload Compiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          retention-days: 1

  # ==========================================
  # JOB 2: Build & Local Container Vulnerability Scan
  # ==========================================
  security-scan:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Compiled Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true # Load into local daemon for scanning
          tags: ${{ secrets.dockerhub-username }}/${{ inputs.image-name }}:scan-test

      - name: Run Trivy Vulnerability Scanner (Security Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.dockerhub-username }}/${{ inputs.image-name }}:scan-test'
          format: 'table'
          exit-code: '1' # Fails the pipeline if CRITICAL or HIGH CVEs exist
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 3: Publish OCI Image to Docker Hub
  # ==========================================
  docker-publish:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Compiled Artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.dockerhub-username }}/${{ inputs.image-name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
